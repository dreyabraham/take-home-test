replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

hpa:
  enabled: false

pdb:
  enabled: false

resourceQuota:
  enabled: true
  hard:
    requests.cpu: "1"
    requests.memory: "1Gi"
    limits.cpu: "2"
    limits.memory: "2Gi"
    pods: "10"

ingress:
  enabled: true
  hostname: "dev.myapp.internal"

env:
  - name: LOG_LEVEL
    value: debug
  - name: APP_ENV
    value: dev
